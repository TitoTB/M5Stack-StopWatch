    step: 15
    mode: box
    unit_of_measurement: "s"
    update_interval: 1s
    lambda: return id(screensaver_timeout_s);
    entity_category: config
    set_action:
      - lambda: |-
          id(screensaver_timeout_s) = std::max(15, std::min(300, static_cast<int>(x + 0.5f)));
      - script.execute: screen_activity
      - script.execute: settings_refresh

  - platform: template
    id: ha_timer_duration
    name: "Timer duración"
    icon: mdi:timer-cog-outline
    min_value: 1
    max_value: 86399
    step: 1
    mode: box
    unit_of_measurement: "s"
    update_interval: 1s
    lambda: return id(timer_config_seconds);
    set_action:
      - lambda: |-
          id(timer_config_seconds) = std::max(1, std::min(86399, static_cast<int>(x + 0.5f)));
      - if:
          condition:
            lambda: return id(alarm_edit_mode) == 0;
          then:
            - script.execute: alarm_load_configuration
      - script.execute: alarm_refresh

datetime:
  - platform: template
    id: ha_alarm_time
    type: time
    name: "Alarma hora"
    icon: mdi:alarm
    update_interval: 1s
    lambda: |-
      ESPTime value{};
      value.hour = id(alarm_config_seconds) / 3600;
      value.minute = (id(alarm_config_seconds) / 60) % 60;
      value.second = id(alarm_config_seconds) % 60;
      return value;
    set_action:
      - lambda: |-
          id(alarm_config_seconds) = x.hour * 3600 + x.minute * 60 + x.second;
      - if:
          condition:
            lambda: return id(alarm_edit_mode) == 1;
          then:
            - script.execute: alarm_load_configuration
      - script.execute: alarm_refresh

sensor:
  - platform: template
    id: ha_timer_remaining
    name: "Timer tiempo restante"
    icon: mdi:timer-sand
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(alarm_mode) != 1 || id(alarm_ringing)) return 0;
      const int32_t remaining_ms = static_cast<int32_t>(id(alarm_deadline_ms) - millis());
      return remaining_ms > 0 ? (static_cast<uint32_t>(remaining_ms) + 999) / 1000 : 0;

button:
  - platform: template
    id: ha_timer_start
    name: "Timer iniciar"
    icon: mdi:timer-play-outline
    on_press:
      - script.execute:
          id: ha_start_schedule
          clock_mode: 0

  - platform: template
    id: ha_alarm_start
    name: "Alarma activar"
    icon: mdi:alarm-check
    on_press:
      - script.execute:
          id: ha_start_schedule
          clock_mode: 1

  - platform: template
    id: ha_timer_cancel
    name: "Timer cancelar"
    icon: mdi:timer-cancel-outline
    on_press:
      - if:
          condition:
            lambda: return id(alarm_mode) == 1;
          then:
            - script.execute: alarm_cancel

  - platform: template
    id: ha_alarm_cancel
    name: "Alarma cancelar"
    icon: mdi:alarm-off
    on_press:
      - if:
          condition:
            lambda: return id(alarm_mode) == 2;
          then:
            - script.execute: alarm_cancel

  - platform: template
    id: stopwatch_vibrate_1s
    name: "Vibrate"
    icon: mdi:vibrate
    on_press:
      - lambda: |-
          id(display_power).set_vibration(id(vibration_enabled) ? 1.0f * id(vibration_power_pct) / 100.0f : 0.0f);
      - delay: 1s
      - lambda: |-
          id(display_power).set_vibration(0.0f);

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    id: stopwatch_microphone
    i2s_audio_id: audio_bus
    adc_type: external
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: left
    pdm: false

speaker:
  - platform: i2s_audio
    id: stopwatch_speaker
    i2s_audio_id: audio_bus
    dac_type: external
    i2s_dout_pin: GPIO21
    bits_per_sample: 16bit
    sample_rate: 44100
    mclk_multiple: 128
    channel: stereo

  # The mixer converts the mono ringtone into the stereo hardware output.
  - platform: mixer
    id: stopwatch_audio_mixer
    output_speaker: stopwatch_speaker
    num_channels: 2
    bits_per_sample: 16
    source_speakers:
      - id: assist_mixer_input
      - id: alarm_mixer_input

  # RTTTL generates 16 kHz audio; the existing codec runs at 44.1 kHz.
  - platform: resampler
    id: alarm_resampler
    output_speaker: alarm_mixer_input
    sample_rate: 44100
    bits_per_sample: 16

rtttl:
  id: alarm_rtttl
  speaker: alarm_resampler
  gain: 35%

media_player:
  - platform: speaker
    id: stopwatch_media_player
    name: "Speaker"
    icon: mdi:speaker
    volume_initial: 80%
    volume_max: 100%
    on_state:
      - if:
          condition:
            lambda: return id(settings_audio_ready);
          then:
            - lambda: |-
                const float volume = id(stopwatch_media_player).volume;
                if (volume >= 0.0f && volume <= 1.0f)
                  id(speaker_volume_pct) = static_cast<int>(volume * 100.0f + 0.5f);
            - script.execute: settings_refresh
    announcement_pipeline:
      speaker: assist_mixer_input
      format: FLAC
      sample_rate: 44100
      num_channels: 2

voice_assistant:
  id: home_assistant_voice
  microphone:
    microphone: stopwatch_microphone
    channels: 0
    gain_factor: 4
  media_player: stopwatch_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Ready"
  on_client_disconnected:
    - if:
        condition:
          lvgl.page.is_showing: page_assist
        then:
          - lvgl.page.show: page_home
    - text_sensor.template.publish:
        id: assist_phase
        state: "Disconnected"
  on_start:
    - if:
        condition:
          lambda: return !id(alarm_ringing);
        then:
          - lvgl.page.show: page_assist
    - text_sensor.template.publish:
        id: assist_phase
        state: "Starting"
  on_listening:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Listening"
    - lambda: |-
        id(display_power).set_vibration(id(vibration_enabled) ? 0.45f * id(vibration_power_pct) / 100.0f : 0.0f);
    - delay: 60ms
    - lambda: |-
        id(display_power).set_vibration(0.0f);
  on_stt_vad_start:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Hearing voice"
  on_stt_vad_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Processing speech"
  on_stt_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Heard"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return x;
  on_intent_start:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Processing"
  on_tts_start:
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Answering"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return x;
  on_tts_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Speaking"
  on_end:
    - if:
        condition:
          lvgl.page.is_showing: page_assist
        then:
          - lvgl.page.show: page_home
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Done"
    - delay: 2s
    - text_sensor.template.publish:
        id: assist_phase
        state: "Ready"
  on_error:
    - if:
        condition:
          lvgl.page.is_showing: page_assist
        then:
          - lvgl.page.show: page_home
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Error"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return message;

