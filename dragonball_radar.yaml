# HA controls use the persisted globals as their source of truth.
number:
  - platform: template
    id: ha_speaker_volume
    name: "Volumen altavoz"
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    unit_of_measurement: "%"
    update_interval: 1s
    lambda: return id(speaker_volume_pct);
    entity_category: config
    set_action:
      - lambda: |-
          id(speaker_volume_pct) = std::max(0, std::min(100, static_cast<int>(x + 0.5f)));
      - script.execute: settings_apply_volume
      - script.execute: screen_activity
      - script.execute: settings_refresh

  - platform: template
    id: ha_alarm_volume
