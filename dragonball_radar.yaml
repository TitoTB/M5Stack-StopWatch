substitutions:

# Device customization
# Personalización del dispositivo

  name: dragon-ball-radar
  friendly_name: Dragon Ball Radar

  # Home Assistant entities controlled from the device list.
  light_ceiling: light.ventilador_estudio
  cover1: cover.estor_estudio_1
  climate: climate.salon
  fan_ceiling: fan.ventilador_estudio
  printer_3d: switch.impresora_3d
  background_image: https://raw.githubusercontent.com/TitoTB/M5Stack-StopWatch/refs/heads/main/assets/bg_db_lines.png
  assist_image: https://raw.githubusercontent.com/TitoTB/M5Stack-StopWatch/refs/heads/main/assets/goku.png

# Other settings
# Otros ajustes

  # First ~7 seconds of the MP3-to-RTTTL adaptation approved in the preview.
  alarm_melody: "Dragon7s:d=8,o=5,b=142:4f,d#,16c,f,4p.,4f,d#,16c,f,4p.,16p,4a#,16a#,16p,16g#,16p,4a#.,16g#,16p,2f.,16c,16p,16d#,16p,f."
  allowed_characters: " []¿?¡!#%'()+,-—_./:µ³°ªº0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZabcdefghijklmnñopqrstuvwxyzáéíóúÁÉÍÓÚäëïöü"

################################################################################################################

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:

      - script.execute:
          id: devices_move
          direction: 0
      - script.execute: alarm_load_configuration
      - script.execute: alarm_refresh
      - script.execute: settings_refresh
      - script.execute: settings_apply_volume
      - logger.log:
          level: INFO
          format: "Inicio completado: controles HA de timer, alarma y ajustes"

      ## Animation
      ## Animación

      - lambda: |-
          lv_obj_t* obj = id(img_assist_status);
          int32_t base_y = lv_obj_get_y(obj);
          static lv_anim_t anim;
          lv_anim_init(&anim);
          lv_anim_set_var(&anim, obj);
          lv_anim_set_exec_cb(&anim, [](void* o, int32_t v) {
            lv_obj_set_y((lv_obj_t*)o, v);
          });
          lv_anim_set_values(&anim, base_y + 5, base_y + 20);
          lv_anim_set_duration(&anim, 2200);
          lv_anim_set_playback_duration(&anim, 2200);
          lv_anim_set_repeat_count(&anim, LV_ANIM_REPEAT_INFINITE);
          lv_anim_set_path_cb(&anim, lv_anim_path_ease_in_out);
          lv_anim_start(&anim);

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
#  encryption:
#    key: "2qSdfsgfrthhtu656u5hje42rgfth4"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Dragon Ball Rad Fallback Hotspot
    password: "Ogfh46y46uk42"

captive_portal:
improv_serial:

external_components:
  - source: github://TitoTB/M5Stack-StopWatch@main
    components: [stopwatch_power, stopwatch_battery, stopwatch_audio, stopwatch_mipi_spi]
    refresh: 1s

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Button Yellow"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

    on_press:
      - lambda: |-
          id(button_a_wake_only) = !id(screen_enabled);
      - script.execute: screen_activity
      - if:
          condition:
            lambda: return id(button_a_wake_only);
          then:
            - switch.turn_on: stopwatch_screen
    on_release:
      - script.execute: screen_activity
    # Short press is handled on release; a long press never moves the list.
    on_click:
      min_length: 20ms
      max_length: 699ms
      then:
        - if:
            condition:
              lambda: return !id(button_a_wake_only);
            then:
              - if:
                  condition:
                    lvgl.page.is_showing: page_home
                  then:
                    - lvgl.page.show: page_devices
                  else:
                    - if:
                        condition:
                          lvgl.page.is_showing: page_devices
                        then:
                          - script.execute:
                              id: devices_move
                              direction: -1
                        else:
                          - if:
                              condition:
                                lvgl.page.is_showing: page_alarm
                              then:
                                - script.execute:
                                    id: alarm_adjust
                                    field: !lambda return id(alarm_edit_field);
                                    direction: -1
                              else:
                                - if:
                                    condition:
                                      lvgl.page.is_showing: page_settings
                                    then:
                                      - script.execute:
                                          id: settings_move
                                          direction: -1
    on_multi_click:
      - timing:
          - ON for at least 700ms
        invalid_cooldown: 0ms
        then:
          - if:
              condition:
                lambda: return !id(button_a_wake_only);
              then:
                - if:
                    condition:
                      lvgl.page.is_showing: page_devices
                    then:
                      - lvgl.page.show: page_home
                    else:
                      - if:
                          condition:
                            lvgl.page.is_showing: page_home
                          then:
                            - script.execute: alarm_enter
                          else:
                            - if:
                                condition:
                                  lvgl.page.is_showing: page_alarm
                                then:
                                  - script.execute: alarm_submit
                                else:
                                  - if:
                                      condition:
                                        lvgl.page.is_showing: page_settings
                                      then:
                                        - script.execute: settings_leave
  - platform: gpio
    id: button_b
    name: "Button Blue"
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - lambda: |-
          id(button_b_wake_only) = !id(screen_enabled);
      - script.execute: screen_activity
      - if:
          condition:
            lambda: return id(button_b_wake_only);
          then:
            - switch.turn_on: stopwatch_screen
    on_release:
      - script.execute: screen_activity
    # Wait for release to distinguish a short press from the settings shortcut.
    on_click:
      min_length: 20ms
      max_length: 699ms
      then:
        - if:
            condition:
              lambda: return !id(button_b_wake_only);
            then:
              - if:
                  condition:
                    or:
                      - lvgl.page.is_showing: page_home
                      - lvgl.page.is_showing: page_assist
                  then:
                    - script.execute: assist_toggle
                  else:
                    - if:
                        condition:
                          lvgl.page.is_showing: page_devices
                        then:
                          - script.execute:
                              id: devices_move
                              direction: 1
                        else:
                          - if:
                              condition:
                                lvgl.page.is_showing: page_alarm
                              then:
                                - script.execute:
                                    id: alarm_adjust
                                    field: !lambda return id(alarm_edit_field);
                                    direction: 1
                              else:
                                - if:
                                    condition:
                                      lvgl.page.is_showing: page_settings
                                    then:
                                      - script.execute:
                                          id: settings_move
                                          direction: 1
    on_multi_click:
      - timing:
          - ON for at least 700ms
        invalid_cooldown: 0ms
        then:
          - if:
              condition:
                lambda: return !id(button_b_wake_only);
              then:
                - if:
                    condition:
                      lvgl.page.is_showing: page_home
                    then:
                      - script.execute: settings_enter
                    else:
                      - if:
                          condition:
                            lvgl.page.is_showing: page_devices
                          then:
                            - script.execute: devices_toggle_selected
                          else:
                            - if:
                                condition:
                                  lvgl.page.is_showing: page_alarm
                                then:
                                  - script.execute: alarm_cancel
                                else:
                                  - if:
                                      condition:
                                        lvgl.page.is_showing: page_settings
                                      then:
                                        - script.execute: settings_activate


globals:
  # Persist configuration, but never restore an armed/ringing schedule after reboot.
  - id: timer_config_seconds
    type: int
    restore_value: true
    initial_value: '300'
  - id: alarm_config_seconds
    type: int
    restore_value: true
    initial_value: '28800'
  - id: screensaver_sleeping
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: vibration_power_pct
    type: int
    restore_value: true
    initial_value: '100'

  - id: screensaver_enabled
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: screensaver_timeout_s
    type: int
    restore_value: true
    initial_value: '60'
  - id: button_a_wake_only
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: button_b_wake_only
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: selected_setting
    type: int
    restore_value: false
    initial_value: '-1'
  - id: settings_volume_edit
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: speaker_volume_pct
    type: int
    restore_value: true
    initial_value: '80'
  - id: alarm_volume_pct
    type: int
    restore_value: true
    initial_value: '35'
  - id: settings_audio_ready
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: vibration_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: alarm_sound_enabled
    type: bool
    restore_value: true
    initial_value: 'true'

  # Field adjusted by the physical buttons: 0 = hours, 1 = minutes, 2 = seconds.
  - id: alarm_edit_field
    type: int
    restore_value: false
    initial_value: '0'
  # One-shot alarms live in RAM and are cancelled on reboot.
  # alarm_mode: 0 = inactive, 1 = countdown, 2 = local clock alarm.
  - id: alarm_mode
    type: int
    restore_value: false
    initial_value: '0'
  - id: alarm_ringing
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: alarm_deadline_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: alarm_target_epoch
    type: time_t
    restore_value: false
    initial_value: '0'
  - id: alarm_edit_mode
    type: int
    restore_value: false
    initial_value: '0'
  - id: alarm_edit_hours
    type: int
    restore_value: false
    initial_value: '0'
  - id: alarm_edit_minutes
    type: int
    restore_value: false
    initial_value: '5'
  - id: alarm_edit_seconds
    type: int
    restore_value: false
    initial_value: '0'
  - id: alarm_message
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: selected_device
    type: int
    restore_value: false
    initial_value: "-1"

  - id: screen_enabled
    type: bool
    restore_value: true
    initial_value: "true"

# Navigation automatically counts the rows in devices_list.
# direction: -1 = previous, 1 = next, 0 = refresh.
script:
  # Configuration is shared by the local editor and the HA controls.
  - id: alarm_load_configuration
    then:
      - lambda: |-
          const int seconds = id(alarm_edit_mode) == 0 ? id(timer_config_seconds) : id(alarm_config_seconds);
          id(alarm_edit_hours) = seconds / 3600;
          id(alarm_edit_minutes) = (seconds / 60) % 60;
          id(alarm_edit_seconds) = seconds % 60;
      - script.execute: alarm_sync_rollers

  - id: ha_start_schedule
    parameters:
      clock_mode: int
    then:
      - if:
          condition:
            lambda: return clock_mode == 1 && !id(esptime).now().is_valid();
          then:
            - lambda: |-
                id(alarm_message) = "Esperando hora de Home Assistant";
            - script.execute: alarm_refresh
          else:
            # Stop any previous sound/vibration before replacing the schedule.
            - script.execute: alarm_cancel
            - lambda: |-
                id(alarm_edit_mode) = clock_mode;
                id(alarm_edit_field) = 0;
            - script.execute: alarm_load_configuration
            - script.execute: alarm_submit

  - id: settings_set_vibration
    parameters:
      enabled: bool
    then:
      - lambda: |-
          id(vibration_enabled) = enabled;
      - if:
          condition:
            lambda: return !enabled;
          then:
            - script.stop: device_toggle_feedback
            - script.stop: alarm_vibration_loop
            - lambda: |-
                id(display_power).set_vibration(0.0f);
          else:
            - if:
                condition:
                  lambda: return id(alarm_ringing);
                then:
                  - script.execute: alarm_vibration_loop
      - script.execute: settings_refresh

  - id: settings_set_alarm_sound
    parameters:
      enabled: bool
    then:
      - lambda: |-
          id(alarm_sound_enabled) = enabled;
      - if:
          condition:
            lambda: return !enabled;
          then:
            - script.stop: alarm_sound_loop
            - rtttl.stop:
                id: alarm_rtttl
            - speaker.stop: alarm_resampler
            - speaker.stop: alarm_mixer_input
          else:
            - if:
                condition:
                  lambda: return id(alarm_ringing);
                then:
                  - script.execute: alarm_sound_loop
      - script.execute: settings_refresh

  - id: screen_activity
    then:
      - lambda: |-
          #if LVGL_VERSION_MAJOR >= 9
          lv_display_trigger_activity(nullptr);
          #else
          lv_disp_trig_activity(nullptr);
          #endif

  - id: settings_apply_volume
    then:
      - media_player.volume_set:
          id: stopwatch_media_player
          volume: !lambda return id(speaker_volume_pct) / 100.0f;
      - lambda: |-
          id(alarm_rtttl).set_gain(id(alarm_volume_pct) / 100.0f);
          id(settings_audio_ready) = true;

  - id: settings_refresh
    mode: restart
    then:
      - lvgl.widget.update:
          id: toggle_settings_vibration
          state:
            checked: !lambda return id(vibration_enabled);
      - lvgl.widget.update:
          id: toggle_settings_alarm_sound
          state:
            checked: !lambda return id(alarm_sound_enabled);
      - lvgl.slider.update:
          id: slider_settings_speaker_volume
          value: !lambda return id(speaker_volume_pct);
          animated: false
      - lvgl.slider.update:
          id: slider_settings_alarm_volume
          value: !lambda return id(alarm_volume_pct);
          animated: false
      - lvgl.widget.update:
          id: toggle_settings_screensaver
          state:
            checked: !lambda return id(screensaver_enabled);
      - lvgl.slider.update:
          id: slider_settings_timeout
          value: !lambda return id(screensaver_timeout_s);
          animated: false
      - lvgl.slider.update:
          id: slider_settings_vibration_power
          value: !lambda return id(vibration_power_pct);
          animated: false
      - lambda: |-
          lv_label_set_text_fmt(id(lbl_settings_vibration_power), "%d%%", id(vibration_power_pct));
          lv_label_set_text_fmt(id(lbl_settings_timeout), "%d s", id(screensaver_timeout_s));
          lv_label_set_text_fmt(id(lbl_settings_speaker_volume), "%d%%", id(speaker_volume_pct));
          lv_label_set_text_fmt(id(lbl_settings_alarm_volume), "%d%%", id(alarm_volume_pct));
          lv_obj_t *list = id(settings_list);
          #if LVGL_VERSION_MAJOR >= 9
          const int count = static_cast<int>(lv_obj_get_child_count(list));
          #else
          const int count = static_cast<int>(lv_obj_get_child_cnt(list));
          #endif
          if (count == 0) return;
          int selected = id(selected_setting) < 0 ? count / 2 : id(selected_setting);
          if (selected >= count) selected = count - 1;
          id(selected_setting) = selected;
          for (int i = 0; i < count; i++) {
            lv_obj_t *row = lv_obj_get_child(list, i);
            const int offset = i - selected;
            if (offset < -1 || offset > 1) {
              lv_obj_add_flag(row, LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            lv_obj_clear_flag(row, LV_OBJ_FLAG_HIDDEN);
            lv_obj_align(row, LV_ALIGN_CENTER, 0, offset * 85);
            lv_obj_set_style_opa(row, offset == 0 ? LV_OPA_COVER : LV_OPA_40, 0);
            lv_obj_set_style_border_opa(row, offset == 0 ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            lv_obj_set_style_border_width(row, offset == 0 && id(settings_volume_edit) ? 2 : 1, 0);
          }


  - id: settings_enter
    then:
      - lambda: |-
          id(settings_volume_edit) = false;
      - script.execute: settings_refresh
      - lvgl.page.show: page_settings

  - id: settings_leave
    then:
      - lambda: |-
          id(settings_volume_edit) = false;
      - lvgl.page.show: page_home

  - id: settings_move
    parameters:
      direction: int
    then:
      - if:
          condition:
            lambda: return id(settings_volume_edit) && (id(selected_setting) == 2 || id(selected_setting) == 3 || id(selected_setting) == 5 || id(selected_setting) == 6);
          then:
            - lambda: |-
                if (id(selected_setting) == 5) {
                  id(screensaver_timeout_s) += direction * 15;
                  if (id(screensaver_timeout_s) < 15) id(screensaver_timeout_s) = 15;
                  if (id(screensaver_timeout_s) > 300) id(screensaver_timeout_s) = 300;
                  return;
                }
                int *value = id(selected_setting) == 6 ? &id(vibration_power_pct) :
                    (id(selected_setting) == 2 ? &id(speaker_volume_pct) : &id(alarm_volume_pct));
                *value += direction * 5;
                if (*value < 0) *value = 0;
                if (*value > 100) *value = 100;
            - script.execute: settings_apply_volume
          else:
            - lambda: |-
                id(selected_setting) += direction;
                if (id(selected_setting) < 0) id(selected_setting) = 0;
      - script.execute: settings_refresh

  - id: settings_activate
    then:
      - lambda: |-
          if (id(selected_setting) == 2 || id(selected_setting) == 3 || id(selected_setting) == 5 || id(selected_setting) == 6) {
            id(settings_volume_edit) = !id(settings_volume_edit);
            return;
          }
          id(settings_volume_edit) = false;
          lv_obj_t *row = lv_obj_get_child(id(settings_list), id(selected_setting));
          if (row == nullptr) return;
          #if LVGL_VERSION_MAJOR >= 9
          const int count = static_cast<int>(lv_obj_get_child_count(row));
          #else
          const int count = static_cast<int>(lv_obj_get_child_cnt(row));
          #endif
          for (int i = 0; i < count; i++) {
            lv_obj_t *toggle = lv_obj_get_child(row, i);
            if (!lv_obj_check_type(toggle, &lv_switch_class)) continue;
            if (lv_obj_has_state(toggle, LV_STATE_CHECKED)) {
              lv_obj_clear_state(toggle, LV_STATE_CHECKED);
            } else {
              lv_obj_add_state(toggle, LV_STATE_CHECKED);
            }
            #if LVGL_VERSION_MAJOR >= 9
            lv_obj_send_event(toggle, LV_EVENT_VALUE_CHANGED, nullptr);
            #else
            lv_event_send(toggle, LV_EVENT_VALUE_CHANGED, nullptr);
            #endif
            return;
          }
      - script.execute: settings_refresh

  - id: settings_select_volume
    parameters:
      index: int
    then:
      - lambda: |-
          id(selected_setting) = index;
          id(settings_volume_edit) = true;
      - script.execute: settings_refresh

  - id: assist_cancel
    then:
      - voice_assistant.stop:
      - media_player.stop:
          id: stopwatch_media_player
          announcement: true
      - speaker.stop: assist_mixer_input
      - text_sensor.template.publish:
          id: assist_phase
          state: "Stopped"
      - lvgl.page.show: page_home

  - id: assist_toggle
    mode: single
    then:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - script.execute: assist_cancel
          else:
            - if:
                condition:
                  and:
                    - lvgl.page.is_showing: page_home
                    - lambda: return !id(alarm_ringing);
                then:
                  - text_sensor.template.publish:
                      id: assist_phase
                      state: "Starting"
                  - text_sensor.template.publish:
                      id: assist_text
                      state: ""
                  - lambda: |-
                      id(audio_codec_setup).configure_microphone();
                  - voice_assistant.start:
                      silence_detection: true

  - id: alarm_refresh
    mode: restart
    then:
      - lambda: |-
          const int configured_seconds = id(alarm_edit_hours) * 3600 +
              id(alarm_edit_minutes) * 60 + id(alarm_edit_seconds);
          if (id(alarm_edit_mode) == 0) {
            if (configured_seconds > 0) id(timer_config_seconds) = configured_seconds;
          } else {
            id(alarm_config_seconds) = configured_seconds;
          }
          lv_label_set_text(id(lbl_alarm_editor_title), id(alarm_edit_mode) == 0 ? "Timer" : "Alarma");
          lv_obj_set_style_opa(id(img_alarm_mode_timer), id(alarm_edit_mode) == 0 ? LV_OPA_COVER : LV_OPA_50, 0);
          lv_obj_set_style_opa(id(img_alarm_mode_clock), id(alarm_edit_mode) == 1 ? LV_OPA_COVER : LV_OPA_50, 0);
          lv_obj_t *rollers[] = {id(roller_alarm_hours)->obj, id(roller_alarm_minutes)->obj, id(roller_alarm_seconds)->obj};
          for (int i = 0; i < 3; i++) {
            const bool selected = i == id(alarm_edit_field);
            lv_obj_set_style_border_color(rollers[i], lv_color_hex(selected ? 0x00FF00 : 0x125012), 0);
            lv_obj_set_style_border_opa(rollers[i], selected ? LV_OPA_COVER : LV_OPA_40, 0);
          }
          if (id(alarm_mode) != 0 || id(alarm_ringing)) {
            lv_obj_clear_flag(id(img_alarm_armed), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(btn_alarm_cancel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_alarm_controls_hint), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(img_alarm_armed), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_alarm_cancel), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_alarm_controls_hint), LV_OBJ_FLAG_HIDDEN);
          }
          if (id(alarm_ringing)) {
            lv_label_set_text(id(lbl_alarm_status), "Pulsa Detener para cancelar");
          } else if (id(alarm_mode) == 1) {
            const int32_t remaining_ms = static_cast<int32_t>(id(alarm_deadline_ms) - millis());
            const uint32_t remaining = remaining_ms > 0 ? (static_cast<uint32_t>(remaining_ms) + 999) / 1000 : 0;
            lv_label_set_text_fmt(id(lbl_alarm_status), "Quedan %02u:%02u:%02u",
                static_cast<unsigned>(remaining / 3600),
                static_cast<unsigned>((remaining / 60) % 60), static_cast<unsigned>(remaining % 60));
          } else if (id(alarm_mode) == 2) {
            auto target = ESPTime::from_epoch_local(id(alarm_target_epoch));
            const auto text = target.strftime("Alarma: %d/%m %H:%M:%S");
            lv_label_set_text(id(lbl_alarm_status), text.c_str());
          } else if (!id(alarm_message).empty()) {
            lv_label_set_text(id(lbl_alarm_status), id(alarm_message).c_str());
          } else {
            lv_label_set_text(id(lbl_alarm_status), "Sin alarma activa");
          }

  # Sync only on entry or mode changes; periodic refresh must not interrupt a swipe.
  - id: alarm_sync_rollers
    then:
      - lambda: |-
          lv_roller_set_selected(id(roller_alarm_hours)->obj, id(alarm_edit_hours), LV_ANIM_OFF);
          lv_roller_set_selected(id(roller_alarm_minutes)->obj, id(alarm_edit_minutes), LV_ANIM_OFF);
          lv_roller_set_selected(id(roller_alarm_seconds)->obj, id(alarm_edit_seconds), LV_ANIM_OFF);

  - id: alarm_focus_field
    parameters:
      field: int
    then:
      - lambda: |-
          if (field >= 0 && field < 3) id(alarm_edit_field) = field;
      - script.execute: alarm_refresh

  - id: alarm_enter
    then:
      - lambda: |-
          id(alarm_edit_field) = 0;
      - script.execute: alarm_sync_rollers
      - script.execute: alarm_refresh
      - lvgl.page.show: page_alarm

  - id: alarm_select_mode
    parameters:
      clock_mode: int
    then:
      - lambda: |-
          id(alarm_edit_mode) = clock_mode;
          id(alarm_edit_field) = 0;
          id(alarm_message).clear();
      - script.execute: alarm_load_configuration
      - script.execute: alarm_refresh

  - id: alarm_adjust
    parameters:
      field: int
      direction: int
    then:
      - lambda: |-
          if (field < 0 || field > 2) return;
          int *value = field == 0 ? &id(alarm_edit_hours) :
              (field == 1 ? &id(alarm_edit_minutes) : &id(alarm_edit_seconds));
          const int limit = field == 0 ? 24 : 60;
          *value = (*value + direction + limit) % limit;
          id(alarm_message).clear();
          lv_obj_t *rollers[] = {id(roller_alarm_hours)->obj, id(roller_alarm_minutes)->obj, id(roller_alarm_seconds)->obj};
          lv_roller_set_selected(rollers[field], *value, LV_ANIM_ON);
      - script.execute: alarm_refresh

  - id: alarm_submit
    then:
      - lambda: |-
          if (id(alarm_edit_mode) == 0) {
            const uint32_t seconds = id(alarm_edit_hours) * 3600U +
                id(alarm_edit_minutes) * 60U + id(alarm_edit_seconds);
            if (seconds == 0) {
              id(alarm_message) = "Elige un tiempo mayor a 0";
              return;
            }
            // All durations are below 24h; signed subtraction tolerates millis() rollover.
            id(alarm_deadline_ms) = millis() + seconds * 1000U;
            id(alarm_mode) = 1;
          } else {
            auto now = id(esptime).now();
            if (!now.is_valid()) {
              id(alarm_message) = "Esperando hora de Home Assistant";
              return;
            }
            // ESPHome owns the timezone; libc mktime() may still use UTC.
            auto target = now;
            target.hour = id(alarm_edit_hours);
            target.minute = id(alarm_edit_minutes);
            target.second = id(alarm_edit_seconds);
            target.recalc_timestamp_local();
            if (target.timestamp <= now.timestamp) {
              target = now;
              // Advance the local calendar, then recalculate its UTC timestamp.
              target.increment_day();
              target.hour = id(alarm_edit_hours);
              target.minute = id(alarm_edit_minutes);
              target.second = id(alarm_edit_seconds);
              target.recalc_timestamp_local();
            }
            if (target.timestamp == static_cast<time_t>(-1)) {
              id(alarm_message) = "No se pudo programar la hora";
              return;
            }
            id(alarm_target_epoch) = target.timestamp;
            id(alarm_mode) = 2;
          }
          id(alarm_message).clear();
      - script.execute: alarm_refresh
      - if:
          condition:
            lambda: return id(alarm_mode) != 0 && id(alarm_message).empty();
          then:
            - lvgl.page.show: page_home

  - id: alarm_cancel
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          id(alarm_mode) = 0;
          id(alarm_deadline_ms) = 0;
          id(alarm_target_epoch) = 0;
          id(alarm_message).clear();
      - script.stop: alarm_fire
      - script.stop: alarm_vibration_loop
      - script.stop: alarm_sound_loop
      - rtttl.stop:
          id: alarm_rtttl
      - speaker.stop: alarm_resampler
      - speaker.stop: alarm_mixer_input
      - lambda: |-
          id(display_power).set_vibration(0.0f);
      - script.execute: alarm_refresh
      - lvgl.page.show: page_home

  - id: alarm_fire
    mode: single
    then:
      - lambda: |-
          id(alarm_ringing) = true;
          lv_label_set_text(id(lbl_alarm_alert), id(alarm_mode) == 1 ? "Cuenta atrás finalizada" : "Es la hora de tu alarma");
      - script.stop: device_toggle_feedback
      - switch.turn_on: stopwatch_screen
      - lvgl.resume:
      - lvgl.page.show: page_alarm_ringing
      - script.execute: alarm_refresh
      # Free the microphone/codec and stop any current voice announcement.
      - voice_assistant.stop:
      - media_player.stop:
          id: stopwatch_media_player
          announcement: true
      - media_player.stop:
          id: stopwatch_media_player
      - speaker.stop: assist_mixer_input
      - delay: 200ms
      - lambda: |-
          id(audio_codec_setup).configure_speaker();
      - if:
          condition:
            lambda: return id(vibration_enabled);
          then:
            - script.execute: alarm_vibration_loop
      - if:
          condition:
            lambda: return id(alarm_sound_enabled);
          then:
            - script.execute: alarm_sound_loop

  - id: alarm_vibration_loop
    mode: single
    then:
      - while:
          condition:
            lambda: return id(alarm_ringing) && id(vibration_enabled);
          then:
            - lambda: |-
                id(display_power).set_vibration(id(vibration_enabled) ? 0.75f * id(vibration_power_pct) / 100.0f : 0.0f);
            - delay: 350ms
            - lambda: |-
                id(display_power).set_vibration(0.0f);
            - delay: 250ms

  - id: alarm_sound_loop
    mode: single
    then:
      - while:
          condition:
            lambda: return id(alarm_ringing) && id(alarm_sound_enabled);
          then:
            - lambda: |-
                id(alarm_rtttl).set_gain(id(alarm_volume_pct) / 100.0f);
            - rtttl.play:
                id: alarm_rtttl
                rtttl: ${alarm_melody}
            - wait_until:
                condition:
                  not:
                    rtttl.is_playing:
                      id: alarm_rtttl
                timeout: 30s
            - rtttl.stop:
                id: alarm_rtttl
            - delay: 500ms

  - id: device_toggle_feedback
    mode: restart
    then:
      - lambda: |-
          ESP_LOGD("device_feedback", "Device toggle: vibration pulse");
          id(display_power).set_vibration(id(vibration_enabled) ? 1.0f * id(vibration_power_pct) / 100.0f : 0.0f);
      - delay: 120ms
      - lambda: |-
          id(display_power).set_vibration(0.0f);

  - id: devices_move
    mode: restart
    parameters:
      direction: int
    then:
      - lambda: |-
          lv_obj_t *list = id(devices_list);
          #if LVGL_VERSION_MAJOR >= 9
          const int count = static_cast<int>(lv_obj_get_child_count(list));
          #else
          const int count = static_cast<int>(lv_obj_get_child_cnt(list));
          #endif
          if (count == 0) {
            id(selected_device) = 0;
            return;
          }
          // Choose the middle device on the first refresh after boot.
          int selected = id(selected_device) < 0 ? count / 2 : id(selected_device);
          selected += direction;
          if (selected < 0) selected = 0;
          if (selected >= count) selected = count - 1;
          id(selected_device) = selected;
          for (int i = 0; i < count; i++) {
            lv_obj_t *row = lv_obj_get_child(list, i);
            const int offset = i - selected;
            if (offset < -1 || offset > 1) {
              lv_obj_add_flag(row, LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            lv_obj_clear_flag(row, LV_OBJ_FLAG_HIDDEN);
            // Fixed center, including the first and last devices.
            lv_obj_align(row, LV_ALIGN_CENTER, 0, offset * 85);
            lv_obj_set_style_opa(row, offset == 0 ? LV_OPA_COVER : LV_OPA_40, 0);
            lv_obj_set_style_border_opa(row, offset == 0 ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          }

  # Reuse the selected row's tactile switch and its existing on_change action.
  - id: devices_toggle_selected
    mode: single
    then:
      - lambda: |-
          lv_obj_t *list = id(devices_list);
          #if LVGL_VERSION_MAJOR >= 9
          const int count = static_cast<int>(lv_obj_get_child_count(list));
          #else
          const int count = static_cast<int>(lv_obj_get_child_cnt(list));
          #endif
          const int selected = id(selected_device);
          if (selected < 0 || selected >= count) return;
          lv_obj_t *row = lv_obj_get_child(list, selected);
          // Find the switch within the selected row, independent of row order.
          #if LVGL_VERSION_MAJOR >= 9
          const int children = static_cast<int>(lv_obj_get_child_count(row));
          #else
          const int children = static_cast<int>(lv_obj_get_child_cnt(row));
          #endif
          for (int i = 0; i < children; i++) {
            lv_obj_t *toggle = lv_obj_get_child(row, i);
            if (!lv_obj_check_type(toggle, &lv_switch_class)) continue;
            if (lv_obj_has_state(toggle, LV_STATE_DISABLED)) return;
            if (lv_obj_has_state(toggle, LV_STATE_CHECKED)) {
              lv_obj_clear_state(toggle, LV_STATE_CHECKED);
            } else {
              lv_obj_add_state(toggle, LV_STATE_CHECKED);
            }
            // The same event as a user toggle fires the existing HA action once.
            #if LVGL_VERSION_MAJOR >= 9
            lv_obj_send_event(toggle, LV_EVENT_VALUE_CHANGED, nullptr);
            #else
            lv_event_send(toggle, LV_EVENT_VALUE_CHANGED, nullptr);
            #endif
            return;
          }

