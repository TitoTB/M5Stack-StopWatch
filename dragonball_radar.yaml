    unit_of_measurement: "%"
    update_interval: 1s
    lambda: return id(alarm_volume_pct);
    entity_category: config
    set_action:
      - lambda: |-
          id(alarm_volume_pct) = std::max(0, std::min(100, static_cast<int>(x + 0.5f)));
      - script.execute: settings_apply_volume
      - script.execute: screen_activity
      - script.execute: settings_refresh

  - platform: template
    id: ha_vibration_power
    name: "Potencia vibración"
