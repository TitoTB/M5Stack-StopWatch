interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (id(alarm_ringing) || id(alarm_mode) == 0) return false;
              if (id(alarm_mode) == 1)
                return static_cast<int32_t>(millis() - id(alarm_deadline_ms)) >= 0;
              const auto now = id(esptime).now();
              return now.is_valid() && now.timestamp >= id(alarm_target_epoch);
          then:
            - script.execute: alarm_fire
      - script.execute: alarm_refresh

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(screensaver_enabled) || !id(screen_enabled) || id(alarm_ringing) ||
                  id(home_assistant_voice).is_running() || id(button_a).state || id(button_b).state)
                return false;
              #if LVGL_VERSION_MAJOR >= 9
              const uint32_t idle_ms = lv_display_get_inactive_time(nullptr);
              #else
              const uint32_t idle_ms = lv_disp_get_inactive_time(nullptr);
              #endif
              return idle_ms >= static_cast<uint32_t>(id(screensaver_timeout_s)) * 1000U;
          then:
            - lambda: |-
                id(screensaver_sleeping) = true;
            - switch.turn_off: stopwatch_screen

  - interval: 2500ms
    then:
      - lvgl.widget.update:
          id: group_simbols
          opa: 60%
      - delay: 700ms
      - lvgl.widget.update:
          id: group_simbols
          opa: 0%
      - delay: 2000ms
