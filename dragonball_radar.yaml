stopwatch_audio:
  id: audio_codec_setup
  i2c_id: sys_i2c
  address: 0x18

stopwatch_battery:
  id: battery_monitor
  i2c_id: sys_i2c
  address: 0x6E
  update_interval: 30min
  voltage:
    name: "Battery Voltage"
  level:
    id: battery_percentage
    name: "Battery"
    on_value:
      then:
      - lvgl.label.update:
          id: lbl_battery_percentage
          text:
            format: "%.0f%%"
            args:
              - id(battery_percentage).state
      - lvgl.label.update:
          id: battery_icon
          text: !lambda |-
            float pct = x;
            if (pct >= 70.0) return "\U0000f24f";
            if (pct >= 30.0) return "\U0000f255";
            return "\U0000f257";

stopwatch_power:
  id: display_power
  i2c_id: sys_i2c
  address: 0x4F
  l3b_pin: 7
  oled_reset_pin: 4
  reset_pulse: true

text_sensor:
  - platform: template
    id: ha_timer_state
    name: "Timer estado"
    icon: mdi:timer-outline
    update_interval: 1s
    lambda: |-
      if (id(alarm_mode) != 1) return {"Inactivo"};
      return id(alarm_ringing) ? std::string("Sonando") : std::string("Activo");

  - platform: template
    id: ha_alarm_state
    name: "Alarma estado"
    icon: mdi:alarm
    update_interval: 1s
    lambda: |-
      if (id(alarm_mode) != 2) return {"Inactiva"};
      return id(alarm_ringing) ? std::string("Sonando") : std::string("Programada");

  - platform: template
    id: ha_alarm_target
    name: "Alarma próxima activación"
    icon: mdi:calendar-clock
    update_interval: 1s
    lambda: |-
      if (id(alarm_mode) != 2) return {"Sin alarma activa"};
      auto target = ESPTime::from_epoch_local(id(alarm_target_epoch));
      return target.strftime("%d/%m/%Y %H:%M:%S");

  - platform: template
    id: ha_alarm_message
    name: "Timer y alarma mensaje"
    icon: mdi:information-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: return id(alarm_message);

  - platform: homeassistant
    id: state_light_ceiling
    entity_id: ${light_ceiling}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: toggle_light_ceiling
          state:
            checked: !lambda return x == "on";
            disabled: !lambda return x.empty() || x == "unknown" || x == "unavailable";

  - platform: homeassistant
    id: state_fan_ceiling
    entity_id: ${fan_ceiling}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: toggle_fan_ceiling
          state:
            checked: !lambda return x == "on";
            disabled: !lambda return x.empty() || x == "unknown" || x == "unavailable";

  - platform: homeassistant
    id: state_cover1
    entity_id: ${cover1}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: toggle_cover1
          state:
            checked: !lambda return x == "open" || x == "opening";
            disabled: !lambda return x.empty() || x == "unknown" || x == "unavailable";

  - platform: homeassistant
    id: state_climate
    entity_id: ${climate}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: toggle_climate
          state:
            checked: !lambda return x != "off" && x != "unknown" && x != "unavailable" && !x.empty();
            disabled: !lambda return x.empty() || x == "unknown" || x == "unavailable";

  - platform: homeassistant
    id: state_printer_3d
    entity_id: ${printer_3d}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: toggle_printer_3d
          state:
            checked: !lambda return x == "on";
            disabled: !lambda return x.empty() || x == "unknown" || x == "unavailable";

  - platform: template
    id: assist_phase
    internal: true
    update_interval: never
    lambda: |-
      return {"Ready"};

  - platform: template
    id: assist_text
    internal: true
    update_interval: never
    lambda: |-
      return {""};

time:
