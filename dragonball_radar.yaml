            text: !lambda 'return id(esptime).now().strftime("%d/%m/%y");'



switch:
  - platform: template
    id: ha_vibration_enabled
    name: "Vibración"
    icon: mdi:vibrate
    entity_category: config
    # The persisted global owns the state. Do not run actions before LVGL setup.
    restore_mode: DISABLED
    lambda: return id(vibration_enabled);
    turn_on_action:
      - script.execute:
          id: settings_set_vibration
          enabled: true
    turn_off_action:
      - script.execute:
          id: settings_set_vibration
          enabled: false

  - platform: template
    id: ha_alarm_sound_enabled
    name: "Sonido alarma"
    icon: mdi:volume-high
    entity_category: config
    restore_mode: DISABLED
    lambda: return id(alarm_sound_enabled);
    turn_on_action:
      - script.execute:
          id: settings_set_alarm_sound
          enabled: true
    turn_off_action:
      - script.execute:
          id: settings_set_alarm_sound
          enabled: false

  - platform: template
    id: ha_screensaver_enabled
    name: "Salvapantallas"
    icon: mdi:monitor-off
    entity_category: config
    restore_mode: DISABLED
    lambda: return id(screensaver_enabled);
    turn_on_action:
      - lambda: |-
          id(screensaver_enabled) = true;
      - script.execute: screen_activity
      - script.execute: settings_refresh
    turn_off_action:
      - lambda: |-
          id(screensaver_enabled) = false;
      - script.execute: screen_activity
      - script.execute: settings_refresh

  - platform: template
    id: stopwatch_screen
    name: "Display"
    icon: mdi:circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - if:
          condition:
            lambda: return id(screensaver_sleeping) && !id(alarm_ringing);
          then:
            - script.execute: settings_leave
      - lambda: |-
          id(screensaver_sleeping) = false;
          id(screen_enabled) = true;
          id(stopwatch_display).set_brightness(180);
      - script.execute: screen_activity
      - lvgl.resume:
    turn_off_action:
      - lambda: |-
          id(screen_enabled) = false;
          id(stopwatch_display).set_brightness(0);
      - lvgl.pause:

