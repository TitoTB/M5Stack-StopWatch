# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: stopwatch
  friendly_name: StopWatch

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "2qSYUUjKca/OGvnlDY+jClB+denlkYE8dul/P69DeSQ="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: StopWatch Fallback Hotspot
    password: "K0zk4j1SIDNH"

captive_portal:

globals:
  - id: screen_enabled
    type: bool
    restore_value: true
    initial_value: "true"

external_components:
  - source: github://TitoTB/M5Stack-StopWatch@2695c96acd01d0e918ef339899b14b97b42b898d
    components: [stopwatch_power]
    refresh: 1s

i2c:
  id: sys_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true

stopwatch_power:
  id: display_power
  i2c_id: sys_i2c
  address: 0x4F
  l3b_pin: 7
  oled_reset_pin: 4
  reset_pulse: true

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Yellow Button"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_b
    name: "Blue Button"
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

switch:
  - platform: template
    id: stopwatch_screen
    name: "Display"
    icon: mdi:circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(screen_enabled) = true;
          id(stopwatch_display).set_brightness(180);
    turn_off_action:
      - lambda: |-
          id(screen_enabled) = false;
          id(stopwatch_display).set_brightness(0);

