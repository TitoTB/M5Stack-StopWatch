# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: stopwatch
  friendly_name: StopWatch

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "2qSYUUjKca/OGvnlDY+jClB+denlkYE8dul/P69DeSQ="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: StopWatch Fallback Hotspot
    password: "K0zk4j1SIDNH"

captive_portal:

globals:
  - id: screen_enabled
    type: bool
    restore_value: true
    initial_value: "true"
  - id: ui_page
    type: int
    restore_value: true
    initial_value: "0"
  - id: ui_from_page
    type: int
    restore_value: false
    initial_value: "0"
  - id: ui_nav_started
    type: uint32_t
    restore_value: false
    initial_value: "0"

external_components:
  - source: github://TitoTB/M5Stack-StopWatch@main
    components: [stopwatch_power, stopwatch_battery, stopwatch_audio]
    refresh: 1s

i2c:
  id: sys_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true

stopwatch_power:
  id: display_power
  i2c_id: sys_i2c
  address: 0x4F
  l3b_pin: 7
  oled_reset_pin: 4
  reset_pulse: true

stopwatch_battery:
  id: battery_monitor
  i2c_id: sys_i2c
  address: 0x6E
  update_interval: 30min
  voltage:
    name: "Battery Voltage"
  level:
    name: "Battery"

stopwatch_audio:
  id: audio_codec_setup
  i2c_id: sys_i2c
  address: 0x18

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Button Yellow"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_b
    name: "Button Blue"
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - text_sensor.template.publish:
                id: assist_phase
                state: "Stopped"
          else:
            - text_sensor.template.publish:
                id: assist_phase
                state: "Hold..."
            - text_sensor.template.publish:
                id: assist_text
                state: ""
            - lambda: |-
                id(display_power).set_vibration(0.35f);
            - delay: 80ms
            - lambda: |-
                id(display_power).set_vibration(0.0f);
            - delay: 800ms
            - if:
                condition:
                  binary_sensor.is_on: button_b
                then:
                  - lambda: |-
                      id(audio_codec_setup).configure_microphone();
                  - text_sensor.template.publish:
                      id: assist_phase
                      state: "Starting"
                  - lambda: |-
                      id(display_power).set_vibration(1.0f);
                  - delay: 120ms
                  - lambda: |-
                      id(display_power).set_vibration(0.0f);
                  - voice_assistant.start:
                      silence_detection: true
                else:
                  - text_sensor.template.publish:
                      id: assist_phase
                      state: "Ready"

text_sensor:
  - platform: template
    id: assist_phase
    internal: true
    update_interval: never
    lambda: |-
      return {"Ready"};

  - platform: template
    id: assist_text
    internal: true
    update_interval: never
    lambda: |-
      return {""};

image:
  - platform: file
    id: radar_map
    file: "https://raw.githubusercontent.com/TitoTB/M5Stack-StopWatch/main/assets/bg.jpg"
    resize: 720x720
    type: RGB565
    transparency: opaque

switch:
  - platform: template
    id: stopwatch_screen
    name: "Display"
    icon: mdi:circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(screen_enabled) = true;
          id(stopwatch_display).set_brightness(180);
    turn_off_action:
      - lambda: |-
          id(screen_enabled) = false;
          id(stopwatch_display).set_brightness(0);

