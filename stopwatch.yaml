button:
  - platform: template
    id: stopwatch_vibrate_1s
    name: "Vibrate"
    icon: mdi:vibrate
    on_press:
      - lambda: |-
          id(display_power).set_vibration(1.0f);
      - delay: 1s
      - lambda: |-
          id(display_power).set_vibration(0.0f);

i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    id: stopwatch_microphone
    i2s_audio_id: audio_bus
    adc_type: external
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: left
    pdm: false

speaker:
  - platform: i2s_audio
    id: stopwatch_speaker
    i2s_audio_id: audio_bus
    dac_type: external
    i2s_dout_pin: GPIO21
    bits_per_sample: 16bit
    sample_rate: 44100
    mclk_multiple: 128
    channel: stereo

media_player:
  - platform: speaker
    id: stopwatch_media_player
    name: "Speaker"
    icon: mdi:speaker
    volume_initial: 80%
    volume_max: 100%
    announcement_pipeline:
      speaker: stopwatch_speaker
      format: FLAC
      sample_rate: 44100
      num_channels: 2

voice_assistant:
  id: home_assistant_voice
  microphone:
    microphone: stopwatch_microphone
    channels: 0
    gain_factor: 4
  media_player: stopwatch_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Ready"
  on_client_disconnected:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Disconnected"
  on_start:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Starting"
  on_listening:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Listening"
    - lambda: |-
        id(display_power).set_vibration(0.45f);
    - delay: 60ms
    - lambda: |-
        id(display_power).set_vibration(0.0f);
  on_stt_vad_start:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Hearing voice"
  on_stt_vad_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Processing speech"
  on_stt_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Heard"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return x;
  on_intent_start:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Processing"
  on_tts_start:
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Answering"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return x;
  on_tts_end:
    - text_sensor.template.publish:
        id: assist_phase
        state: "Speaking"
  on_end:
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Done"
    - delay: 2s
    - text_sensor.template.publish:
        id: assist_phase
        state: "Ready"
  on_error:
    - lambda: |-
        id(audio_codec_setup).configure_speaker();
    - text_sensor.template.publish:
        id: assist_phase
        state: "Error"
    - text_sensor.template.publish:
        id: assist_text
        state: !lambda |-
          return message;

spi:
  id: oled_qspi
  type: quad
  clk_pin: GPIO40
  data_pins:
    - GPIO41
    - GPIO42
    - GPIO46
    - GPIO45
  interface: spi3

display:
  - platform: mipi_spi
    id: stopwatch_display
    spi_id: oled_qspi
    model: CO5300
    bus_mode: quad
    cs_pin: GPIO39
    dimensions:
      width: 480
      height: 480
    color_order: rgb
    invert_colors: false
    brightness: 180
    update_interval: 500ms
    lambda: |-
      if (!id(screen_enabled)) {
        it.fill(Color::BLACK);
        return;
      }

      auto white = Color(255, 255, 255);
      auto cyan = Color(0, 220, 255);
      auto gray = Color(120, 120, 120);
      auto dim = Color(35, 35, 35);

      it.fill(Color::BLACK);
      it.filled_rectangle(0, 0, 480, 480, Color::BLACK);

      it.print(240, 54, id(font_title), cyan, display::TextAlign::CENTER, "StopWatch");
      it.line(54, 96, 426, 96, dim);

      it.print(240, 150, id(font_label), gray, display::TextAlign::CENTER, "Home Assistant");
      it.print(240, 194, id(font_value), white, display::TextAlign::CENTER, "Online");

      it.print(240, 270, id(font_label), gray, display::TextAlign::CENTER, "Assistant");
      it.print(240, 312, id(font_value), white, display::TextAlign::CENTER, id(assist_phase).state.c_str());

      std::string assist_line = id(assist_text).state;
      if (assist_line.size() > 34) {
        assist_line = assist_line.substr(0, 34);
      }
      if (!assist_line.empty()) {
        it.print(240, 360, id(font_small), gray, display::TextAlign::CENTER, assist_line.c_str());
      }

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 28
  - file: "gfonts://Roboto"
    id: font_label
    size: 18
  - file: "gfonts://Roboto Mono"
    id: font_value
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

touchscreen:
  - platform: cst816
    id: stopwatch_touch
    i2c_id: sys_i2c
    display: stopwatch_display
    interrupt_pin: GPIO13
    skip_probe: false
