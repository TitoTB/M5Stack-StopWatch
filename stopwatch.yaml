# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: stopwatch
  friendly_name: StopWatch

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "2qSYUUjKca/OGvnlDY+jClB+denlkYE8dul/P69DeSQ="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: StopWatch Fallback Hotspot
    password: "K0zk4j1SIDNH"

captive_portal:

external_components:
  - source: github://TitoTB/M5Stack-StopWatch@main
    components: [stopwatch_power]
    refresh: 1s

i2c:
  id: sys_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true

stopwatch_power:
  id: display_power
  i2c_id: sys_i2c
  address: 0x4F
  l3b_pin: 7
  oled_reset_pin: 4
  reset_pulse: true

binary_sensor:
  - platform: gpio
    id: button_a
    name: "StopWatch Button A"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_b
    name: "StopWatch Button B"
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

spi:
  id: oled_qspi
  type: quad
  clk_pin: GPIO40
  data_pins:
    - GPIO41
    - GPIO42
    - GPIO46
    - GPIO45
  interface: spi3

display:
  - platform: mipi_spi
    id: stopwatch_display
    spi_id: oled_qspi
    model: CO5300
    bus_mode: quad
    cs_pin: GPIO39
    dimensions:
      width: 466
      height: 466
    color_order: rgb
    invert_colors: false
    brightness: 180
    update_interval: 1s
    show_test_card: true

touchscreen:
  - platform: cst816
    id: stopwatch_touch
    i2c_id: sys_i2c
    display: stopwatch_display
    interrupt_pin: GPIO13
    skip_probe: false
    on_touch:
      - lambda: |-
          ESP_LOGI("stopwatch_touch", "touch id=%d x=%d y=%d raw_x=%d raw_y=%d",
                   touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
    on_update:
      - lambda: |-
          for (auto touch : touches) {
            if (touch.state <= 2) {
              ESP_LOGD("stopwatch_touch", "update id=%d state=%d x=%d y=%d raw_x=%d raw_y=%d",
                       touch.id, touch.state, touch.x, touch.y, touch.x_raw, touch.y_raw);
            }
          }
    on_release:
      - lambda: |-
          ESP_LOGI("stopwatch_touch", "release");
