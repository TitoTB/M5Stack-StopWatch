button:
  - platform: template
    id: stopwatch_vibrate_1s
    name: "Vibrate"
    icon: mdi:vibrate
    on_press:
      - lambda: |-
          id(display_power).set_vibration(1.0f);
      - delay: 1s
      - lambda: |-
          id(display_power).set_vibration(0.0f);

spi:
  id: oled_qspi
  type: quad
  clk_pin: GPIO40
  data_pins:
    - GPIO41
    - GPIO42
    - GPIO46
    - GPIO45
  interface: spi3

display:
  - platform: mipi_spi
    id: stopwatch_display
    spi_id: oled_qspi
    model: CO5300
    bus_mode: quad
    cs_pin: GPIO39
    dimensions:
      width: 468
      height: 466
    color_order: rgb
    invert_colors: false
    brightness: 180
    update_interval: 500ms
    lambda: |-
      if (!id(screen_enabled)) {
        it.fill(Color::BLACK);
        return;
      }

      auto white = Color(255, 255, 255);
      auto cyan = Color(0, 220, 255);
      auto gray = Color(120, 120, 120);
      auto dim = Color(35, 35, 35);

      it.fill(Color::BLACK);
      it.filled_rectangle(0, 0, 468, 466, Color::BLACK);

      it.print(234, 54, id(font_title), cyan, display::TextAlign::CENTER, "StopWatch");
      it.line(54, 96, 414, 96, dim);

      it.print(234, 150, id(font_label), gray, display::TextAlign::CENTER, "Home Assistant");
      it.print(234, 194, id(font_value), white, display::TextAlign::CENTER, "Online");

      it.print(234, 284, id(font_label), gray, display::TextAlign::CENTER, "Buttons, touch and vibration");
      it.print(234, 326, id(font_value), white, display::TextAlign::CENTER, "Ready");

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 28
  - file: "gfonts://Roboto"
    id: font_label
    size: 18
  - file: "gfonts://Roboto Mono"
    id: font_value
    size: 24

touchscreen:
  - platform: cst816
    id: stopwatch_touch
    i2c_id: sys_i2c
    display: stopwatch_display
    interrupt_pin: GPIO13
    skip_probe: false
