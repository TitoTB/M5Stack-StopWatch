# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: stopwatch
  friendly_name: StopWatch

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: "2qSYUUjKca/OGvnlDY+jClB+denlkYE8dul/P69DeSQ="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: StopWatch Fallback Hotspot
    password: "K0zk4j1SIDNH"

captive_portal:

globals:
  - id: screen_enabled
    type: bool
    restore_value: true
    initial_value: "true"

external_components:
  - source: github://TitoTB/M5Stack-StopWatch@2695c96acd01d0e918ef339899b14b97b42b898d
    components: [stopwatch_power]
    refresh: 1s

i2c:
  id: sys_i2c
  sda: GPIO47
  scl: GPIO48
  frequency: 100kHz
  scan: true

stopwatch_power:
  id: display_power
  i2c_id: sys_i2c
  address: 0x4F
  l3b_pin: 7
  oled_reset_pin: 4
  reset_pulse: true

binary_sensor:
  - platform: gpio
    id: button_a
    name: "StopWatch Button A"
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

  - platform: gpio
    id: button_b
    name: "StopWatch Button B"
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

switch:
  - platform: template
    id: stopwatch_screen
    name: "StopWatch Screen"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(screen_enabled) = true;
    turn_off_action:
      - lambda: |-
          id(screen_enabled) = false;

motion:
  - platform: bmi270
    id: stopwatch_imu
    i2c_id: sys_i2c
    address: 0x68
    update_interval: 500ms
    accelerometer_range: 4G
    gyroscope_range: 2000DPS

sensor:
  - platform: motion
    motion_id: stopwatch_imu
    type: acceleration_x
    id: imu_accel_x
    internal: true
    accuracy_decimals: 3
  - platform: motion
    motion_id: stopwatch_imu
    type: acceleration_y
    id: imu_accel_y
    internal: true
    accuracy_decimals: 3
  - platform: motion
    motion_id: stopwatch_imu
    type: acceleration_z
    id: imu_accel_z
    internal: true
    accuracy_decimals: 3
  - platform: motion
    motion_id: stopwatch_imu
    type: angular_rate_x
    id: imu_gyro_x
    internal: true
    accuracy_decimals: 2
  - platform: motion
    motion_id: stopwatch_imu
    type: angular_rate_y
    id: imu_gyro_y
    internal: true
    accuracy_decimals: 2
  - platform: motion
    motion_id: stopwatch_imu
    type: angular_rate_z
    id: imu_gyro_z
    internal: true
    accuracy_decimals: 2
  - platform: motion
    motion_id: stopwatch_imu
    type: roll
    id: imu_roll
    internal: true
    accuracy_decimals: 1
  - platform: motion
    motion_id: stopwatch_imu
    type: pitch
    id: imu_pitch
    internal: true
    accuracy_decimals: 1

button:
  - platform: template
    id: stopwatch_vibrate_1s
    name: "StopWatch Vibrate 1s"
    on_press:
      - lambda: |-
          id(display_power).set_vibration(1.0f);
      - delay: 1s
      - lambda: |-
          id(display_power).set_vibration(0.0f);

spi:
  id: oled_qspi
  type: quad
  clk_pin: GPIO40
  data_pins:
    - GPIO41
    - GPIO42
    - GPIO46
    - GPIO45
  interface: spi3

display:
  - platform: mipi_spi
    id: stopwatch_display
    spi_id: oled_qspi
    model: CO5300
    bus_mode: quad
    cs_pin: GPIO39
    dimensions:
      width: 466
      height: 466
    color_order: rgb
    invert_colors: false
    brightness: 180
    update_interval: 500ms
    lambda: |-
      if (!id(screen_enabled)) {
        it.fill(Color::BLACK);
        return;
      }

      auto white = Color(255, 255, 255);
      auto cyan = Color(0, 220, 255);
      auto green = Color(50, 255, 150);
      auto gray = Color(120, 120, 120);
      auto dim = Color(35, 35, 35);

      it.fill(Color::BLACK);
      it.filled_rectangle(0, 0, 466, 466, Color::BLACK);

      it.print(233, 28, id(font_title), cyan, display::TextAlign::CENTER, "BMI270 IMU");
      it.line(44, 68, 422, 68, dim);
      it.line(233, 92, 233, 398, dim);

      it.print(54, 96, id(font_label), gray, "ACCEL g");
      it.printf(54, 132, id(font_value), white, "X % .3f", id(imu_accel_x).state);
      it.printf(54, 170, id(font_value), white, "Y % .3f", id(imu_accel_y).state);
      it.printf(54, 208, id(font_value), white, "Z % .3f", id(imu_accel_z).state);

      it.print(54, 268, id(font_label), gray, "ANGLE");
      it.printf(54, 304, id(font_value), green, "R % .1f", id(imu_roll).state);
      it.printf(54, 342, id(font_value), green, "P % .1f", id(imu_pitch).state);

      it.print(262, 96, id(font_label), gray, "GYRO deg/s");
      it.printf(262, 132, id(font_value), white, "X % .1f", id(imu_gyro_x).state);
      it.printf(262, 170, id(font_value), white, "Y % .1f", id(imu_gyro_y).state);
      it.printf(262, 208, id(font_value), white, "Z % .1f", id(imu_gyro_z).state);

      it.print(262, 268, id(font_label), gray, "SCREEN");
      it.print(262, 304, id(font_value), green, "ON");

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 28
  - file: "gfonts://Roboto"
    id: font_label
    size: 18
  - file: "gfonts://Roboto Mono"
    id: font_value
    size: 24

touchscreen:
  - platform: cst816
    id: stopwatch_touch
    i2c_id: sys_i2c
    display: stopwatch_display
    interrupt_pin: GPIO13
    skip_probe: false
